name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: Build, test, verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The IntelliJ Platform build needs tens of GB (IDE distributions, extracted
      # transforms, two verifier IDEs); the stock runner image runs out of disk while
      # saving the Gradle cache. Drop preinstalled toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Extracted IDE distributions live under transforms and are re-derivable
          # from the cached downloads; archiving them is what exhausted the disk.
          gradle-home-cache-excludes: |
            caches/**/transforms

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Plugin Verifier
        run: ./gradlew :plugin:verifyPlugin --no-daemon

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
